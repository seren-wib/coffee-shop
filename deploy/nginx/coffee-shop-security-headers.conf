# Browser security headers (SDD 9.6). Copied to /etc/nginx/ by install.sh.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.tosspayments.com; frame-src https://*.tosspayments.com; connect-src 'self' https://*.tosspayments.com; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://*.tosspayments.com" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
