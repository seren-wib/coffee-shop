# Site template (SDD 10.3). install.sh replaces __DOMAIN__, __ORIGIN_CERT__ and
# __ORIGIN_KEY__ and writes the result to /etc/nginx/sites-available/coffee-shop.
# There is no port 80 server: Cloudflare turns HTTP into HTTPS (NFR-4).
server {
    listen 443 ssl http2;                    # nginx 1.24 on Ubuntu 24.04 does not know `http2 on;`
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    ssl_certificate     __ORIGIN_CERT__;
    ssl_certificate_key __ORIGIN_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Trust CF-Connecting-IP only from Cloudflare ranges (written by cloudflare-real-ip.sh).
    include /etc/nginx/cloudflare-real-ip.conf;
    real_ip_header CF-Connecting-IP;

    # Path without the query string (SDD 8.5). log_format is in coffee-shop-log.conf.
    access_log /var/log/nginx/coffee-shop.access.log coffee_shop;
    error_log  /var/log/nginx/coffee-shop.error.log warn;

    root /srv/coffee-shop/current/frontend/dist;

    location /api/ {
        proxy_pass http://unix:/run/coffee-shop/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;   # drop the client's value (SDD 8.3)
        client_max_body_size 1m;
    }
    location = /api/health/ {
        access_log off;
        proxy_pass http://unix:/run/coffee-shop/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/coffee-shop-security-headers.conf;   # add_header is not inherited
    }
    location / {
        try_files $uri /index.html;          # React Router paths
        add_header Cache-Control "no-cache";
        include /etc/nginx/coffee-shop-security-headers.conf;   # SDD 8.6
    }
}
